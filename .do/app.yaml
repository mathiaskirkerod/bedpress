name: bedpress
services:
- name: backend
  source_dir: /backend
  github:
    repo: your-username/bedpress
    branch: main
  run_command: python -m uv run uvicorn main:app --host 0.0.0.0 --port 8000
  environment_slug: python
  instance_count: 1
  instance_size_slug: basic-xxs
  http_port: 8000
  envs:
  - key: OPENAI_API_KEY
    scope: RUN_TIME
    type: SECRET
  - key: REACT_APP_API_PASSWORD
    scope: RUN_TIME
    type: SECRET

- name: frontend
  source_dir: /frontend
  github:
    repo: your-username/bedpress
    branch: main
  run_command: serve -s build -l 3000
  build_command: npm ci && npm run build && npm install -g serve
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: basic-xxs
  http_port: 3000
  envs:
  - key: REACT_APP_API_URL
    value: ${backend.PUBLIC_URL}