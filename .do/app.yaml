name: bedpress
services:
- name: backend
  source_dir: backend
  dockerfile_path: Dockerfile
  github:
    repo: mathiaskirkerod/bedpress
    branch: main
  environment_slug: docker
  instance_count: 1
  instance_size_slug: basic-xxs
  http_port: 8000
  envs:
  - key: OPENAI_API_KEY
    scope: RUN_TIME
    type: SECRET
  - key: REACT_APP_API_PASSWORD
    scope: RUN_TIME
    type: SECRET

- name: frontend
  source_dir: frontend
  dockerfile_path: Dockerfile
  github:
    repo: mathiaskirkerod/bedpress
    branch: main
  environment_slug: docker
  instance_count: 1
  instance_size_slug: basic-xxs
  http_port: 3000
  envs:
  - key: REACT_APP_API_URL
    value: ${backend.PUBLIC_URL}